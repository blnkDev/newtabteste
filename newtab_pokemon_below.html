<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />

  <!-- Adaptive Tab Bar Colour -->
  <meta name="theme-color" content="#101010" id="theme-color" />

  <title>New Tab</title>

  <style>
    :root {
      /*
        WALLPAPER:
        Coloque uma imagem chamada "wallpaper.jpg" na MESMA pasta deste HTML.
        Se preferir .webp ou .png, troque o nome abaixo.
      */
      --wallpaper: url("./wallpaper.jpg");

      --overlay: 0.28;
      --wallpaper-position: 50% 50%;
      --text-color: #fff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: #101010;
      color: var(--text-color);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .wallpaper,
    .shade {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .wallpaper {
      z-index: -2;
      background-image: var(--wallpaper);
      background-size: cover;
      background-position: var(--wallpaper-position);
      background-repeat: no-repeat;
      transform: scale(1.01);
    }

    .shade {
      z-index: -1;
      background:
        radial-gradient(
          circle at center,
          rgba(0, 0, 0, 0.02) 0%,
          rgba(0, 0, 0, 0.10) 55%,
          rgba(0, 0, 0, 0.24) 100%
        ),
        rgba(0, 0, 0, var(--overlay));
    }

    main {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: translateY(-2vh);
      user-select: none;
      animation: enter 700ms cubic-bezier(.22, 1, .36, 1) both;
    }

    .clock-wrap {
      position: relative;
      z-index: 2;
      cursor: default;
    }

    #clock {
      margin: 0;
      font-size: clamp(4.6rem, 7vw, 7.7rem);
      font-weight: 750;
      line-height: 0.9;
      letter-spacing: -0.065em;
      text-shadow: 0 3px 22px rgba(0, 0, 0, 0.28);
    }

    .pokemon-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;

      width: 160px;
      max-height: 0;
      margin-top: 0;

      opacity: 0;
      overflow: hidden;
      transform: translateY(-16px) scale(0.96);
      pointer-events: none;

      transition:
        max-height 560ms cubic-bezier(.22, 1, .36, 1),
        margin-top 560ms cubic-bezier(.22, 1, .36, 1),
        opacity 260ms ease 80ms,
        transform 560ms cubic-bezier(.22, 1, .36, 1);
    }

    .pokemon-panel img {
      width: 112px;
      height: 112px;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 3px 12px rgba(0, 0, 0, 0.28));
    }

    #message {
      margin-top: 8px;
      text-align: center;
      white-space: nowrap;

      font-size: clamp(1rem, 1.35vw, 1.35rem);
      font-weight: 650;
      letter-spacing: -0.025em;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.30);
    }

    .hero:hover .pokemon-panel {
      max-height: 180px;
      margin-top: 18px;
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(calc(-2vh + 10px)) scale(0.99);
      }
      to {
        opacity: 1;
        transform: translateY(-2vh) scale(1);
      }
    }

    @media (max-width: 700px) {
      main {
        padding: 20px;
      }

      .pokemon-panel {
        width: 132px;
      }

      .pokemon-panel img {
        width: 88px;
        height: 88px;
      }

      .hero:hover .pokemon-panel {
        max-height: 155px;
        margin-top: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero {
        animation: none;
      }

      .pokemon-panel {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <div class="wallpaper"></div>
  <div class="shade"></div>

  <main>
    <section class="hero" aria-label="Relógio e Pokémon">
      <div class="clock-wrap">
        <h1 id="clock">00:00</h1>
      </div>

      <div class="pokemon-panel" id="pokemon-panel" aria-hidden="true">
        <img id="pokemon-sprite" alt="" />
        <div id="message"></div>
      </div>
    </section>
  </main>

  <script>
    const clock = document.getElementById("clock");
    const pokemonSprite = document.getElementById("pokemon-sprite");
    const message = document.getElementById("message");
    const themeColor = document.getElementById("theme-color");

    function getMessage(hour) {
      if (hour >= 5 && hour < 12) return "Bom dia.";
      if (hour >= 12 && hour < 18) return "Boa tarde.";
      if (hour >= 18 && hour < 23) return "Boa noite.";
      return "Toca a acordar.";
    }

    function updateClock() {
      const now = new Date();

      clock.textContent = now.toLocaleTimeString("pt-BR", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      });

      message.textContent = getMessage(now.getHours());
    }

    async function setRandomPokemon() {
      /*
        Procura um Pokémon aleatório com sprite animado.
        Prioriza a coleção Showdown e usa os sprites animados
        de Black/White como fallback.
      */
      for (let attempt = 0; attempt < 12; attempt++) {
        const pokemonId = Math.floor(Math.random() * 1025) + 1;

        try {
          const response = await fetch(
            `https://pokeapi.co/api/v2/pokemon/${pokemonId}`
          );

          if (!response.ok) continue;

          const pokemon = await response.json();

          const showdownGif =
            pokemon.sprites?.other?.showdown?.front_default;

          const blackWhiteGif =
            pokemon.sprites?.versions?.["generation-v"]?.["black-white"]
              ?.animated?.front_default;

          const sprite = showdownGif || blackWhiteGif;

          if (!sprite) continue;

          pokemonSprite.src = sprite;
          pokemonSprite.alt = pokemon.name;
          pokemonSprite.title = pokemon.name;
          return;
        } catch {
          // Tenta outro Pokémon.
        }
      }

      pokemonSprite.removeAttribute("src");
    }

    function getWallpaperUrl() {
      const value = getComputedStyle(document.documentElement)
        .getPropertyValue("--wallpaper")
        .trim();

      const match = value.match(/^url\(["']?(.*?)["']?\)$/);
      return match?.[1] || null;
    }

    function syncThemeColorToWallpaper() {
      const wallpaperUrl = getWallpaperUrl();
      if (!wallpaperUrl) return;

      const image = new Image();

      image.onload = () => {
        try {
          const sampleWidth = 96;
          const sampleHeight = 8;

          const canvas = document.createElement("canvas");
          canvas.width = sampleWidth;
          canvas.height = sampleHeight;

          const context = canvas.getContext("2d", {
            willReadFrequently: true
          });

          if (!context) return;

          const viewportRatio = innerWidth / innerHeight;
          const imageRatio = image.naturalWidth / image.naturalHeight;

          let visibleWidth;
          let visibleHeight;
          let sourceX;
          let sourceY;

          if (imageRatio > viewportRatio) {
            visibleHeight = image.naturalHeight;
            visibleWidth = visibleHeight * viewportRatio;
            sourceX = (image.naturalWidth - visibleWidth) / 2;
            sourceY = 0;
          } else {
            visibleWidth = image.naturalWidth;
            visibleHeight = visibleWidth / viewportRatio;
            sourceX = 0;
            sourceY = (image.naturalHeight - visibleHeight) / 2;
          }

          const topStripHeight = Math.max(
            1,
            visibleHeight * (sampleHeight / innerHeight)
          );

          context.drawImage(
            image,
            sourceX,
            sourceY,
            visibleWidth,
            topStripHeight,
            0,
            0,
            sampleWidth,
            sampleHeight
          );

          const pixels = context.getImageData(
            0,
            0,
            sampleWidth,
            sampleHeight
          ).data;

          let red = 0;
          let green = 0;
          let blue = 0;
          let count = 0;

          for (let i = 0; i < pixels.length; i += 4) {
            if (pixels[i + 3] === 0) continue;

            red += pixels[i];
            green += pixels[i + 1];
            blue += pixels[i + 2];
            count++;
          }

          if (!count) return;

          red /= count;
          green /= count;
          blue /= count;

          const overlay = parseFloat(
            getComputedStyle(document.documentElement)
              .getPropertyValue("--overlay")
          ) || 0;

          const topShade = 0.24;
          const keep = (1 - overlay) * (1 - topShade);

          red = Math.round(red * keep);
          green = Math.round(green * keep);
          blue = Math.round(blue * keep);

          const hex = `#${[red, green, blue]
            .map(value => value.toString(16).padStart(2, "0"))
            .join("")}`;

          themeColor.setAttribute("content", hex);
        } catch {
          themeColor.setAttribute("content", "#101010");
        }
      };

      image.onerror = () => {
        themeColor.setAttribute("content", "#101010");
      };

      image.src = wallpaperUrl;
    }

    updateClock();
    setRandomPokemon();
    syncThemeColorToWallpaper();

    // Atualiza no início de cada novo minuto.
    const delay = (60 - new Date().getSeconds()) * 1000;

    setTimeout(() => {
      updateClock();
      setInterval(updateClock, 60_000);
    }, delay);

    window.addEventListener("resize", syncThemeColorToWallpaper);
  </script>
</body>
</html>
