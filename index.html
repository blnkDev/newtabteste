<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />

  <!-- Adaptive Tab Bar Colour -->
  <meta name="theme-color" content="#101010" id="theme-color" />

  <title>New Tab</title>

  <style>
    :root {
      /*
        Se você continuar sem wallpaper, pode simplesmente deixar o arquivo ausente.
        O fundo #101010 continuará sendo usado normalmente.
      */
      --wallpaper: url("./wallpaper.jpg");

      --overlay: 0.28;
      --wallpaper-position: 50% 50%;
      --text-color: #fff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: #101010;
      color: var(--text-color);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .wallpaper,
    .shade {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .wallpaper {
      z-index: -2;
      background-image: var(--wallpaper);
      background-size: cover;
      background-position: var(--wallpaper-position);
      background-repeat: no-repeat;
      transform: scale(1.01);
    }

    .shade {
      z-index: -1;
      background:
        radial-gradient(
          circle at center,
          rgba(0, 0, 0, 0.02) 0%,
          rgba(0, 0, 0, 0.10) 55%,
          rgba(0, 0, 0, 0.24) 100%
        ),
        rgba(0, 0, 0, var(--overlay));
    }

    main {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: translateY(-2vh);
      user-select: none;
      animation: enter 700ms cubic-bezier(.22, 1, .36, 1) both;
    }

    .clock-wrap {
      position: relative;
      z-index: 2;
      cursor: default;
    }

    #clock {
      margin: 0;
      font-size: clamp(4.6rem, 7vw, 7.7rem);
      font-weight: 750;
      line-height: 0.9;
      letter-spacing: -0.065em;
      text-shadow: 0 3px 22px rgba(0, 0, 0, 0.28);
    }

    .pokemon-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;

      width: 190px;
      max-height: 0;
      margin-top: 0;

      opacity: 0;
      overflow: hidden;
      transform: translateY(-16px) scale(0.96);
      pointer-events: none;

      transition:
        max-height 560ms cubic-bezier(.22, 1, .36, 1),
        margin-top 560ms cubic-bezier(.22, 1, .36, 1),
        opacity 260ms ease 80ms,
        transform 560ms cubic-bezier(.22, 1, .36, 1);
    }

    .pokemon-sprite-wrap {
      position: relative;
      width: 112px;
      height: 112px;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .pokemon-panel img {
      position: relative;
      z-index: 2;

      width: 112px;
      height: 112px;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 3px 12px rgba(0, 0, 0, 0.28));

      cursor: pointer;
      pointer-events: auto;

      transition:
        opacity 150ms ease,
        transform 150ms ease,
        filter 220ms ease;
    }

    .pokemon-panel img:hover {
      transform: scale(1.05);
    }

    .pokemon-panel img.loading {
      opacity: 0.25;
      transform: scale(0.94);
    }

    .pokemon-panel img.switching {
      opacity: 0;
      transform: translateY(7px) scale(0.90);
    }

    /* Efeito especial quando o sorteio vem shiny */
    .pokemon-sprite-wrap.shiny::before {
      content: "";
      position: absolute;
      inset: 13px;
      z-index: 0;
      border-radius: 50%;
      opacity: 0;
      background:
        radial-gradient(
          circle,
          rgba(255, 246, 181, 0.34) 0%,
          rgba(255, 220, 112, 0.14) 40%,
          transparent 72%
        );
      pointer-events: none;
    }

    .hero:hover .pokemon-sprite-wrap.shiny::before {
      animation: shiny-glow 1200ms cubic-bezier(.22, 1, .36, 1) both;
    }

    .hero:hover .pokemon-sprite-wrap.shiny img {
      animation: shiny-pop 760ms cubic-bezier(.22, 1, .36, 1) both;
      filter:
        drop-shadow(0 3px 12px rgba(0, 0, 0, 0.28))
        drop-shadow(0 0 11px rgba(255, 232, 138, 0.34));
    }

    .shiny-sparkles {
      position: absolute;
      inset: -5px;
      z-index: 3;
      pointer-events: none;
    }

    .shiny-sparkles span {
      position: absolute;
      display: block;
      opacity: 0;
      color: rgba(255, 245, 190, 0.95);
      font-size: 17px;
      line-height: 1;
      text-shadow: 0 0 8px rgba(255, 224, 123, 0.55);
    }

    .shiny-sparkles span:nth-child(1) { top: 4px; left: 20px; }
    .shiny-sparkles span:nth-child(2) { top: 17px; right: 6px; font-size: 12px; }
    .shiny-sparkles span:nth-child(3) { top: 55px; left: -2px; font-size: 11px; }
    .shiny-sparkles span:nth-child(4) { bottom: 6px; right: 18px; font-size: 15px; }
    .shiny-sparkles span:nth-child(5) { bottom: 12px; left: 18px; font-size: 9px; }
    .shiny-sparkles span:nth-child(6) { top: 45px; right: -5px; font-size: 9px; }

    .hero:hover .pokemon-sprite-wrap.shiny .shiny-sparkles span:nth-child(1) {
      animation: sparkle 900ms 70ms ease-out both;
    }

    .hero:hover .pokemon-sprite-wrap.shiny .shiny-sparkles span:nth-child(2) {
      animation: sparkle 760ms 180ms ease-out both;
    }

    .hero:hover .pokemon-sprite-wrap.shiny .shiny-sparkles span:nth-child(3) {
      animation: sparkle 820ms 260ms ease-out both;
    }

    .hero:hover .pokemon-sprite-wrap.shiny .shiny-sparkles span:nth-child(4) {
      animation: sparkle 900ms 130ms ease-out both;
    }

    .hero:hover .pokemon-sprite-wrap.shiny .shiny-sparkles span:nth-child(5) {
      animation: sparkle 760ms 330ms ease-out both;
    }

    .hero:hover .pokemon-sprite-wrap.shiny .shiny-sparkles span:nth-child(6) {
      animation: sparkle 820ms 390ms ease-out both;
    }

    @keyframes shiny-glow {
      0%   { opacity: 0; transform: scale(0.58); }
      30%  { opacity: 1; transform: scale(1.22); }
      100% { opacity: 0.30; transform: scale(1); }
    }

    @keyframes shiny-pop {
      0%   { transform: scale(0.84); }
      42%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    @keyframes sparkle {
      0%   { opacity: 0; transform: scale(0.20) rotate(0deg); }
      35%  { opacity: 1; transform: scale(1.25) rotate(35deg); }
      100% { opacity: 0; transform: scale(0.45) rotate(90deg); }
    }


    #message {
      margin-top: 8px;
      text-align: center;
      white-space: nowrap;

      font-size: clamp(1rem, 1.35vw, 1.35rem);
      font-weight: 650;
      letter-spacing: -0.025em;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.30);
    }

    .hero:hover .pokemon-panel {
      max-height: 205px;
      margin-top: 18px;
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    /* Busca escondida */
    .search-layer {
      position: fixed;
      inset: 0;
      z-index: 20;

      display: grid;
      place-items: center;

      padding: 24px;

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      background: rgba(0, 0, 0, 0.18);
      backdrop-filter: blur(6px);

      transition:
        opacity 180ms ease,
        visibility 180ms ease;
    }

    .search-layer.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .search-box {
      width: min(560px, 88vw);
      transform: translateY(-4vh) scale(0.98);
      transition: transform 220ms cubic-bezier(.22, 1, .36, 1);
    }

    .search-layer.open .search-box {
      transform: translateY(-4vh) scale(1);
    }

    #search-input {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      outline: none;

      padding: 15px 18px;
      border-radius: 16px;

      background: rgba(14, 14, 14, 0.78);
      color: #fff;

      font: inherit;
      font-size: 1.02rem;

      box-shadow:
        0 18px 55px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    #search-input::placeholder {
      color: rgba(255, 255, 255, 0.42);
    }

    #search-input:focus {
      border-color: rgba(255, 255, 255, 0.24);
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(calc(-2vh + 10px)) scale(0.99);
      }
      to {
        opacity: 1;
        transform: translateY(-2vh) scale(1);
      }
    }

    @media (max-width: 700px) {
      main {
        padding: 20px;
      }

      .pokemon-panel {
        width: 160px;
      }

      .pokemon-sprite-wrap,
      .pokemon-panel img {
        width: 88px;
        height: 88px;
      }

      .hero:hover .pokemon-panel {
        max-height: 185px;
        margin-top: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero {
        animation: none;
      }

      .pokemon-panel,
      .pokemon-panel img,
      .search-layer,
      .search-box {
        transition: none;
      }

      .hero:hover .pokemon-sprite-wrap.shiny::before,
      .hero:hover .pokemon-sprite-wrap.shiny img,
      .hero:hover .pokemon-sprite-wrap.shiny .shiny-sparkles span {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div class="wallpaper"></div>
  <div class="shade"></div>

  <main>
    <section class="hero" aria-label="Relógio e Pokémon">
      <div class="clock-wrap">
        <h1 id="clock">00:00</h1>
      </div>

      <div class="pokemon-panel" id="pokemon-panel" aria-hidden="true">
        <div class="pokemon-sprite-wrap" id="pokemon-sprite-wrap">
          <div class="shiny-sparkles" aria-hidden="true">
            <span>✦</span>
            <span>✦</span>
            <span>✦</span>
            <span>✦</span>
            <span>✦</span>
            <span>✦</span>
          </div>
          <img id="pokemon-sprite" alt="" />
        </div>
        <div id="message"></div>
      </div>
    </section>
  </main>

  <div class="search-layer" id="search-layer" aria-hidden="true">
    <div class="search-box">
      <input
        id="search-input"
        type="text"
        placeholder="Pesquisar..."
        autocomplete="off"
        spellcheck="false"
        aria-label="Pesquisar"
      />
    </div>
  </div>

  <script>
    const clock = document.getElementById("clock");
    const pokemonSprite = document.getElementById("pokemon-sprite");
    const pokemonSpriteWrap = document.getElementById("pokemon-sprite-wrap");
    const pokemonPanel = document.getElementById("pokemon-panel");
    const message = document.getElementById("message");
    const themeColor = document.getElementById("theme-color");

    const searchLayer = document.getElementById("search-layer");
    const searchInput = document.getElementById("search-input");

    /*
      FAVORITOS:
      Coloque aqui os números da Pokédex dos seus favoritos.
      Quando a lista tiver algum Pokémon, existe 5% de chance
      de um sorteio usar um deles.
    */
    const FAVORITE_POKEMON_IDS = [];
    const FAVORITE_CHANCE = 0.05;

    /*
      Chance de shiny por sorteio.
      0.02 = 2%.
    */
    const SHINY_CHANCE = 0.02;

    const KEYBOARD_SHORTCUTS = {
      y: "https://youtube.com",
      g: "https://github.com",
      s: "https://open.spotify.com"
    };

    const PHRASES = {
      madrugada: [
        "A madrugada rende.",
        "Só mais uma aba.",
        "Silêncio lá fora.",
        "Você ainda tá acordado?",
        "Hora estranha pra estar produtivo.",
        "O sono perdeu essa batalha.",
        "A noite ainda não acabou."
      ],
      manha: [
        "Bom dia.",
        "Começa sem pressa.",
        "Dia novo.",
        "Bora fazer alguma coisa boa.",
        "Primeiro passo do dia.",
        "A manhã tá só começando.",
        "Abriu a aba, começou."
      ],
      tarde: [
        "Boa tarde.",
        "Ainda dá tempo.",
        "Segue o baile.",
        "Uma coisa de cada vez.",
        "Continua.",
        "Metade do caminho.",
        "A tarde ainda rende."
      ],
      noite: [
        "Boa noite.",
        "Dia quase fechado.",
        "Desacelera um pouco.",
        "Últimas quests do dia.",
        "A noite começou.",
        "Mais uma antes de parar.",
        "Hora de fechar algumas abas."
      ],
      fimDoDia: [
        "Já tá ficando tarde.",
        "Última do dia?",
        "Quase amanhã.",
        "Talvez seja hora de parar.",
        "Só não perde a noção do horário.",
        "Amanhã continua."
      ]
    };

    /*
      Easter eggs exatos de horário.
      Eles substituem temporariamente a frase normal.
    */
    const TIME_EASTER_EGGS = {
      "00:00": "Um novo dia começou.",
      "03:33": "Um Gastly passou por aqui.",
      "04:04": "Pokémon not found.",
      "06:00": "A rota abriu.",
      "12:34": "12:34. Satisfatório.",
      "13:37": "Leet o'clock.",
      "20:20": "Visão perfeita.",
      "22:22": "Faz um desejo.",
      "23:59": "Último minuto do dia."
    };

    let currentPhrase = "";
    let currentPhrasePeriod = "";
    let currentEasterEgg = null;

    let nextPokemonPromise = null;
    let pokemonChanging = false;
    let pendingShinySound = false;
    let audioContext = null;

    function getPeriod(hour) {
      if (hour < 5) return "madrugada";
      if (hour < 12) return "manha";
      if (hour < 18) return "tarde";
      if (hour < 23) return "noite";
      return "fimDoDia";
    }

    function pickDifferent(items, previous) {
      if (items.length <= 1) return items[0];

      const alternatives = items.filter(item => item !== previous);
      return alternatives[Math.floor(Math.random() * alternatives.length)];
    }

    function updatePhrase(forceRandom = false) {
      const now = new Date();

      const timeKey = now.toLocaleTimeString("pt-BR", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      });

      const easterEgg = TIME_EASTER_EGGS[timeKey];

      if (easterEgg) {
        currentEasterEgg = timeKey;
        currentPhrase = easterEgg;
        message.textContent = easterEgg;
        return;
      }

      const period = getPeriod(now.getHours());

      if (
        forceRandom ||
        currentEasterEgg !== null ||
        currentPhrasePeriod !== period ||
        !currentPhrase
      ) {
        currentPhrase = pickDifferent(PHRASES[period], currentPhrase);
        currentPhrasePeriod = period;
        currentEasterEgg = null;
      }

      message.textContent = currentPhrase;
    }

    function updateClock() {
      const now = new Date();

      clock.textContent = now.toLocaleTimeString("pt-BR", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      });

      updatePhrase(false);
    }

    function getRandomPokemonId() {
      const shouldUseFavorite =
        FAVORITE_POKEMON_IDS.length > 0 &&
        Math.random() < FAVORITE_CHANCE;

      if (shouldUseFavorite) {
        return FAVORITE_POKEMON_IDS[
          Math.floor(Math.random() * FAVORITE_POKEMON_IDS.length)
        ];
      }

      return Math.floor(Math.random() * 1025) + 1;
    }

    function formatPokemonName(name) {
      return name
        .split("-")
        .map(part => part.charAt(0).toUpperCase() + part.slice(1))
        .join(" ");
    }

    function preloadImage(url) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(url);
        image.onerror = reject;
        image.src = url;
      });
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function preparePokemon() {
      for (let attempt = 0; attempt < 14; attempt++) {
        const pokemonId = getRandomPokemonId();
        const isShiny = Math.random() < SHINY_CHANCE;

        try {
          const response = await fetch(
            `https://pokeapi.co/api/v2/pokemon/${pokemonId}`
          );

          if (!response.ok) continue;

          const pokemon = await response.json();

          const showdown = pokemon.sprites?.other?.showdown;
          const blackWhiteAnimated =
            pokemon.sprites?.versions?.["generation-v"]?.["black-white"]
              ?.animated;

          const normalSprite =
            showdown?.front_default ||
            blackWhiteAnimated?.front_default;

          const shinySprite =
            showdown?.front_shiny ||
            blackWhiteAnimated?.front_shiny;

          const sprite = isShiny ? shinySprite : normalSprite;

          /*
            Se o shiny sorteado não tiver GIF animado disponível,
            tentamos outro Pokémon para manter a regra do idle animado.
          */
          if (!sprite) continue;

          await preloadImage(sprite);

          return {
            id: pokemon.id,
            name: formatPokemonName(pokemon.name),
            sprite,
            isShiny
          };
        } catch {
          // Tenta outro Pokémon.
        }
      }

      throw new Error("Não foi possível preparar um Pokémon.");
    }

    function queueNextPokemon() {
      nextPokemonPromise = preparePokemon();
    }

    async function getPreparedPokemon(firstLoad = false) {
      if (firstLoad || !nextPokemonPromise) {
        return preparePokemon();
      }

      const prepared = await nextPokemonPromise;
      return prepared;
    }

    function getAudioContext() {
      if (!audioContext) {
        const AudioContextClass =
          window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) return null;
        audioContext = new AudioContextClass();
      }

      return audioContext;
    }

    async function playShinySound() {
      try {
        const context = getAudioContext();
        if (!context) return false;

        if (context.state === "suspended") {
          await context.resume();
        }

        if (context.state !== "running") {
          return false;
        }

        const now = context.currentTime;
        const notes = [
          { frequency: 987.77, delay: 0.00, duration: 0.16 },
          { frequency: 1318.51, delay: 0.08, duration: 0.18 },
          { frequency: 1567.98, delay: 0.17, duration: 0.22 },
          { frequency: 2093.00, delay: 0.28, duration: 0.30 }
        ];

        notes.forEach(({ frequency, delay, duration }, index) => {
          const oscillator = context.createOscillator();
          const gain = context.createGain();

          oscillator.type = index % 2 === 0 ? "sine" : "triangle";
          oscillator.frequency.setValueAtTime(
            frequency,
            now + delay
          );

          gain.gain.setValueAtTime(0.0001, now + delay);
          gain.gain.exponentialRampToValueAtTime(
            0.07,
            now + delay + 0.018
          );
          gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + delay + duration
          );

          oscillator.connect(gain);
          gain.connect(context.destination);

          oscillator.start(now + delay);
          oscillator.stop(now + delay + duration + 0.02);
        });

        pendingShinySound = false;
        return true;
      } catch {
        return false;
      }
    }

    async function triggerShinySound() {
      const played = await playShinySound();

      /*
        Firefox/Chrome podem bloquear áudio automático em uma nova aba.
        Nesse caso o som fica pendente e toca na primeira interação
        real do usuário.
      */
      if (!played) {
        pendingShinySound = true;
      }
    }

    function flushPendingShinySound() {
      if (!pendingShinySound) return;
      playShinySound();
    }

    async function showNextPokemon(firstLoad = false) {
      if (pokemonChanging) return;

      pokemonChanging = true;

      try {
        /*
          O primeiro Pokémon entra normalmente.
          Nas próximas trocas, fazemos uma saída curta mesmo com
          o próximo sprite já pré-carregado, para a troca não parecer seca.
        */
        if (!firstLoad && pokemonSprite.getAttribute("src")) {
          pokemonSprite.classList.add("switching");
          await wait(170);
        } else {
          pokemonSprite.classList.add("loading");
        }

        const prepared = await getPreparedPokemon(firstLoad);

        pokemonSpriteWrap.classList.toggle(
          "shiny",
          prepared.isShiny
        );

        pokemonSprite.src = prepared.sprite;
        pokemonSprite.alt = prepared.name;
        pokemonSprite.removeAttribute("title");

        /*
          Reinicia o efeito shiny caso o novo Pokémon também seja shiny.
        */
        if (prepared.isShiny) {
          pokemonSpriteWrap.classList.remove("shiny");
          void pokemonSpriteWrap.offsetWidth;
          pokemonSpriteWrap.classList.add("shiny");
          triggerShinySound();
        }

        /*
          Força o navegador a registrar o estado escondido antes
          de animar o novo Pokémon de volta para a posição normal.
        */
        if (!firstLoad) {
          void pokemonSprite.offsetWidth;
          requestAnimationFrame(() => {
            pokemonSprite.classList.remove("switching");
          });
        }

        /*
          Assim que o atual aparece, o próximo já começa a ser
          buscado e seu GIF fica carregado em memória.
        */
        queueNextPokemon();
      } catch {
        pokemonSprite.classList.remove("switching");

        if (!nextPokemonPromise) {
          queueNextPokemon();
        }
      } finally {
        pokemonSprite.classList.remove("loading");
        pokemonChanging = false;
      }
    }

    function refreshExperience() {
      updatePhrase(true);
      showNextPokemon(false);
    }

    function openSearch(initialValue = "") {
      searchLayer.classList.add("open");
      searchLayer.setAttribute("aria-hidden", "false");

      searchInput.value = initialValue;

      const focusSearch = () => {
        searchInput.focus({ preventScroll: true });
        const cursorPosition = searchInput.value.length;
        searchInput.setSelectionRange(cursorPosition, cursorPosition);
      };

      focusSearch();
      requestAnimationFrame(focusSearch);
    }

    function closeSearch() {
      searchLayer.classList.remove("open");
      searchLayer.setAttribute("aria-hidden", "true");
      searchInput.value = "";
      searchInput.blur();
    }

    function runSearch() {
      const query = searchInput.value.trim();

      if (!query) {
        closeSearch();
        return;
      }

      const looksLikeUrl =
        /^https?:\/\//i.test(query) ||
        /^[^\s]+\.[^\s]+$/.test(query);

      if (looksLikeUrl) {
        const target = /^https?:\/\//i.test(query)
          ? query
          : `https://${query}`;

        window.location.href = target;
        return;
      }

      window.location.href =
        `https://www.google.com/search?q=${encodeURIComponent(query)}`;
    }

    searchInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        runSearch();
      }

      if (event.key === "Escape") {
        event.preventDefault();
        closeSearch();
      }
    });

    searchLayer.addEventListener("mousedown", event => {
      if (event.target === searchLayer) {
        closeSearch();
      }
    });

    document.addEventListener("keydown", event => {
      flushPendingShinySound();

      if (
        event.ctrlKey ||
        event.altKey ||
        event.metaKey ||
        event.isComposing
      ) {
        return;
      }

      if (document.activeElement === searchInput) {
        return;
      }

      /*
        Shift + R:
        novo Pokémon + nova frase, sem recarregar a página.
      */
      if (
        event.shiftKey &&
        event.key.toLowerCase() === "r"
      ) {
        event.preventDefault();
        refreshExperience();
        return;
      }

      /*
        Atalhos só funcionam com Shift.
      */
      if (event.shiftKey) {
        const shortcut = KEYBOARD_SHORTCUTS[event.key.toLowerCase()];

        if (shortcut) {
          event.preventDefault();
          window.location.href = shortcut;
          return;
        }
      }

      /*
        Space e / continuam abrindo a busca vazia.
      */
      if (event.key === "/" || event.key === " ") {
        event.preventDefault();
        openSearch();
        return;
      }

      /*
        Qualquer caractere digitável já abre a pesquisa
        levando o primeiro caractere junto.
      */
      if (event.key.length === 1) {
        event.preventDefault();
        openSearch(event.key);
      }
    });

    document.addEventListener(
      "pointerdown",
      flushPendingShinySound,
      { passive: true }
    );

    pokemonPanel.addEventListener("mouseenter", () => {
      if (pokemonSpriteWrap.classList.contains("shiny")) {
        triggerShinySound();
      }
    });

    pokemonSprite.addEventListener("click", event => {
      event.stopPropagation();
      flushPendingShinySound();
      showNextPokemon(false);
    });

    function getWallpaperUrl() {
      const value = getComputedStyle(document.documentElement)
        .getPropertyValue("--wallpaper")
        .trim();

      const match = value.match(/^url\(["']?(.*?)["']?\)$/);
      return match?.[1] || null;
    }

    function syncThemeColorToWallpaper() {
      const wallpaperUrl = getWallpaperUrl();
      if (!wallpaperUrl) return;

      const image = new Image();

      image.onload = () => {
        try {
          const sampleWidth = 96;
          const sampleHeight = 8;

          const canvas = document.createElement("canvas");
          canvas.width = sampleWidth;
          canvas.height = sampleHeight;

          const context = canvas.getContext("2d", {
            willReadFrequently: true
          });

          if (!context) return;

          const viewportRatio = innerWidth / innerHeight;
          const imageRatio = image.naturalWidth / image.naturalHeight;

          let visibleWidth;
          let visibleHeight;
          let sourceX;
          let sourceY;

          if (imageRatio > viewportRatio) {
            visibleHeight = image.naturalHeight;
            visibleWidth = visibleHeight * viewportRatio;
            sourceX = (image.naturalWidth - visibleWidth) / 2;
            sourceY = 0;
          } else {
            visibleWidth = image.naturalWidth;
            visibleHeight = visibleWidth / viewportRatio;
            sourceX = 0;
            sourceY = (image.naturalHeight - visibleHeight) / 2;
          }

          const topStripHeight = Math.max(
            1,
            visibleHeight * (sampleHeight / innerHeight)
          );

          context.drawImage(
            image,
            sourceX,
            sourceY,
            visibleWidth,
            topStripHeight,
            0,
            0,
            sampleWidth,
            sampleHeight
          );

          const pixels = context.getImageData(
            0,
            0,
            sampleWidth,
            sampleHeight
          ).data;

          let red = 0;
          let green = 0;
          let blue = 0;
          let count = 0;

          for (let i = 0; i < pixels.length; i += 4) {
            if (pixels[i + 3] === 0) continue;

            red += pixels[i];
            green += pixels[i + 1];
            blue += pixels[i + 2];
            count++;
          }

          if (!count) return;

          red /= count;
          green /= count;
          blue /= count;

          const overlay = parseFloat(
            getComputedStyle(document.documentElement)
              .getPropertyValue("--overlay")
          ) || 0;

          const topShade = 0.24;
          const keep = (1 - overlay) * (1 - topShade);

          red = Math.round(red * keep);
          green = Math.round(green * keep);
          blue = Math.round(blue * keep);

          const hex = `#${[red, green, blue]
            .map(value => value.toString(16).padStart(2, "0"))
            .join("")}`;

          themeColor.setAttribute("content", hex);
        } catch {
          themeColor.setAttribute("content", "#101010");
        }
      };

      image.onerror = () => {
        themeColor.setAttribute("content", "#101010");
      };

      image.src = wallpaperUrl;
    }

    updateClock();
    updatePhrase(true);
    showNextPokemon(true);
    syncThemeColorToWallpaper();

    /*
      Atualiza no início de cada novo minuto.
      Isso também permite que os easter eggs apareçam
      exatamente no horário certo.
    */
    const delay = (60 - new Date().getSeconds()) * 1000;

    setTimeout(() => {
      updateClock();
      setInterval(updateClock, 60_000);
    }, delay);

    window.addEventListener("resize", syncThemeColorToWallpaper);
  </script>
</body>
</html>
