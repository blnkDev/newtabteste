<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />

  <!-- Adaptive Tab Bar Colour -->
  <meta name="theme-color" content="#101010" id="theme-color" />

  <title>New Tab</title>

  <style>
    :root {
      /*
        Se você continuar sem wallpaper, pode simplesmente deixar o arquivo ausente.
        O fundo #101010 continuará sendo usado normalmente.
      */
      --wallpaper: url("./wallpaper.jpg");

      --overlay: 0.28;
      --wallpaper-position: 50% 50%;
      --text-color: #fff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: #101010;
      color: var(--text-color);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .wallpaper,
    .shade {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .wallpaper {
      z-index: -2;
      background-image: var(--wallpaper);
      background-size: cover;
      background-position: var(--wallpaper-position);
      background-repeat: no-repeat;
      transform: scale(1.01);
    }

    .shade {
      z-index: -1;
      background:
        radial-gradient(
          circle at center,
          rgba(0, 0, 0, 0.02) 0%,
          rgba(0, 0, 0, 0.10) 55%,
          rgba(0, 0, 0, 0.24) 100%
        ),
        rgba(0, 0, 0, var(--overlay));
    }

    main {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: translateY(-2vh);
      user-select: none;
      animation: enter 700ms cubic-bezier(.22, 1, .36, 1) both;
    }

    .clock-wrap {
      position: relative;
      z-index: 2;
      cursor: default;
    }

    #clock {
      margin: 0;
      font-size: clamp(4.6rem, 7vw, 7.7rem);
      font-weight: 750;
      line-height: 0.9;
      letter-spacing: -0.065em;
      text-shadow: 0 3px 22px rgba(0, 0, 0, 0.28);
    }

    .pokemon-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;

      width: min(420px, 88vw);
      max-height: 0;
      margin-top: 0;

      opacity: 0;
      overflow: hidden;
      transform: translateY(-16px) scale(0.96);
      pointer-events: none;

      transition:
        max-height 560ms cubic-bezier(.22, 1, .36, 1),
        margin-top 560ms cubic-bezier(.22, 1, .36, 1),
        opacity 260ms ease 80ms,
        transform 560ms cubic-bezier(.22, 1, .36, 1);
    }

    .pokemon-sprite-wrap {
      position: relative;
      width: 112px;
      height: 112px;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .pokemon-panel img {
      position: relative;
      z-index: 2;

      width: 112px;
      height: 112px;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 3px 12px rgba(0, 0, 0, 0.28));

      cursor: pointer;
      pointer-events: auto;

      transition:
        opacity 150ms ease,
        transform 150ms ease,
        filter 220ms ease;
    }

    .pokemon-panel img:hover {
      transform: scale(1.05);
    }

    .pokemon-panel img.loading {
      opacity: 0.25;
      transform: scale(0.94);
    }

    .pokemon-panel img.switching {
      opacity: 0;
      transform: translateY(7px) scale(0.90);
    }

    /* Efeito especial quando o sorteio vem shiny */
    .pokemon-sprite-wrap.shiny::before {
      content: "";
      position: absolute;
      inset: 13px;
      z-index: 0;
      border-radius: 50%;
      opacity: 0;
      background:
        radial-gradient(
          circle,
          rgba(255, 246, 181, 0.34) 0%,
          rgba(255, 220, 112, 0.14) 40%,
          transparent 72%
        );
      pointer-events: none;
    }

    .hero:hover .pokemon-sprite-wrap.shiny::before {
      animation: shiny-glow 1200ms cubic-bezier(.22, 1, .36, 1) both;
    }

    .hero:hover .pokemon-sprite-wrap.shiny img {
      animation: shiny-pop 760ms cubic-bezier(.22, 1, .36, 1) both;
      filter:
        drop-shadow(0 3px 12px rgba(0, 0, 0, 0.28))
        drop-shadow(0 0 11px rgba(255, 232, 138, 0.34));
    }

    .shiny-sparkles {
      position: absolute;
      inset: -5px;
      z-index: 3;
      pointer-events: none;
    }

    .shiny-sparkles span {
      position: absolute;
      display: block;
      opacity: 0;
      color: rgba(255, 245, 190, 0.95);
      font-size: 17px;
      line-height: 1;
      text-shadow: 0 0 8px rgba(255, 224, 123, 0.55);
    }

    .shiny-sparkles span:nth-child(1) { top: 4px; left: 20px; }
    .shiny-sparkles span:nth-child(2) { top: 17px; right: 6px; font-size: 12px; }
    .shiny-sparkles span:nth-child(3) { top: 55px; left: -2px; font-size: 11px; }
    .shiny-sparkles span:nth-child(4) { bottom: 6px; right: 18px; font-size: 15px; }
    .shiny-sparkles span:nth-child(5) { bottom: 12px; left: 18px; font-size: 9px; }
    .shiny-sparkles span:nth-child(6) { top: 45px; right: -5px; font-size: 9px; }

    .hero:hover .pokemon-sprite-wrap.shiny .shiny-sparkles span:nth-child(1) {
      animation: sparkle 900ms 70ms ease-out both;
    }

    .hero:hover .pokemon-sprite-wrap.shiny .shiny-sparkles span:nth-child(2) {
      animation: sparkle 760ms 180ms ease-out both;
    }

    .hero:hover .pokemon-sprite-wrap.shiny .shiny-sparkles span:nth-child(3) {
      animation: sparkle 820ms 260ms ease-out both;
    }

    .hero:hover .pokemon-sprite-wrap.shiny .shiny-sparkles span:nth-child(4) {
      animation: sparkle 900ms 130ms ease-out both;
    }

    .hero:hover .pokemon-sprite-wrap.shiny .shiny-sparkles span:nth-child(5) {
      animation: sparkle 760ms 330ms ease-out both;
    }

    .hero:hover .pokemon-sprite-wrap.shiny .shiny-sparkles span:nth-child(6) {
      animation: sparkle 820ms 390ms ease-out both;
    }

    @keyframes shiny-glow {
      0%   { opacity: 0; transform: scale(0.58); }
      30%  { opacity: 1; transform: scale(1.22); }
      100% { opacity: 0.30; transform: scale(1); }
    }

    @keyframes shiny-pop {
      0%   { transform: scale(0.84); }
      42%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    @keyframes sparkle {
      0%   { opacity: 0; transform: scale(0.20) rotate(0deg); }
      35%  { opacity: 1; transform: scale(1.25) rotate(35deg); }
      100% { opacity: 0; transform: scale(0.45) rotate(90deg); }
    }


    #message {
      margin-top: 8px;
      text-align: center;
      white-space: normal;
      max-width: 420px;
      line-height: 1.25;

      font-size: clamp(1rem, 1.35vw, 1.35rem);
      font-weight: 650;
      letter-spacing: -0.025em;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.30);
    }

    .hero:hover .pokemon-panel {
      max-height: 240px;
      margin-top: 18px;
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    /* Busca escondida */
    .search-layer {
      position: fixed;
      inset: 0;
      z-index: 20;

      display: grid;
      place-items: center;

      padding: 24px;

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      background: rgba(0, 0, 0, 0.18);
      backdrop-filter: blur(6px);

      transition:
        opacity 180ms ease,
        visibility 180ms ease;
    }

    .search-layer.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .search-box {
      width: min(560px, 88vw);
      transform: translateY(-4vh) scale(0.98);
      transition: transform 220ms cubic-bezier(.22, 1, .36, 1);
    }

    .search-layer.open .search-box {
      transform: translateY(-4vh) scale(1);
    }

    #search-input {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      outline: none;

      padding: 15px 18px;
      border-radius: 16px;

      background: rgba(14, 14, 14, 0.78);
      color: #fff;

      font: inherit;
      font-size: 1.02rem;

      box-shadow:
        0 18px 55px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    #search-input::placeholder {
      color: rgba(255, 255, 255, 0.42);
    }

    #search-input:focus {
      border-color: rgba(255, 255, 255, 0.24);
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(calc(-2vh + 10px)) scale(0.99);
      }
      to {
        opacity: 1;
        transform: translateY(-2vh) scale(1);
      }
    }


    /* =========================
       GACHA V1
       ========================= */

    .hero.details-open:hover .pokemon-panel {
      max-height: 410px;
    }

    .roll-card {
      width: min(320px, 82vw);
      max-height: 0;
      margin-top: 0;
      opacity: 0;
      overflow: hidden;
      transform: translateY(-8px);

      transition:
        max-height 340ms cubic-bezier(.22, 1, .36, 1),
        margin-top 340ms cubic-bezier(.22, 1, .36, 1),
        opacity 180ms ease,
        transform 340ms cubic-bezier(.22, 1, .36, 1);
    }

    .hero.details-open .roll-card {
      max-height: 155px;
      margin-top: 14px;
      opacity: 1;
      transform: translateY(0);
    }

    .roll-card-inner {
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.10);
      text-align: center;
    }

    #roll-name {
      font-size: 0.90rem;
      font-weight: 650;
      letter-spacing: -0.015em;
    }

    #roll-rarity {
      margin-top: 3px;
      font-size: 0.76rem;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      opacity: 0.62;
    }

    #roll-rarity.shiny {
      opacity: 0.92;
    }

    #gacha-stats {
      margin-top: 8px;
      font-size: 0.72rem;
      font-weight: 550;
      opacity: 0.48;
    }

    .roll-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }

    .gacha-button {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 999px;
      padding: 7px 12px;

      background: rgba(255, 255, 255, 0.055);
      color: rgba(255, 255, 255, 0.82);

      font: inherit;
      font-size: 0.72rem;
      font-weight: 650;

      cursor: pointer;
      transition:
        background 150ms ease,
        border-color 150ms ease,
        opacity 150ms ease,
        transform 150ms ease;
    }

    .gacha-button:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.10);
      border-color: rgba(255, 255, 255, 0.20);
      transform: translateY(-1px);
    }

    .gacha-button:disabled {
      opacity: 0.30;
      cursor: default;
    }

    .gacha-button.primary {
      background: rgba(255, 255, 255, 0.92);
      color: #151515;
      border-color: transparent;
    }

    .gacha-button.primary:hover:not(:disabled) {
      background: #fff;
    }

    /* Collection */
    .collection-layer {
      position: fixed;
      inset: 0;
      z-index: 30;

      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      background: rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(10px);

      transition:
        opacity 180ms ease,
        visibility 180ms ease;
    }

    .collection-layer.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .collection-window {
      width: min(760px, 92vw);
      max-height: min(680px, 82vh);
      display: flex;
      flex-direction: column;

      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 22px;
      overflow: hidden;

      background: rgba(14, 14, 14, 0.90);
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.42);

      transform: translateY(8px) scale(0.985);
      transition: transform 220ms cubic-bezier(.22, 1, .36, 1);
    }

    .collection-layer.open .collection-window {
      transform: translateY(0) scale(1);
    }

    .collection-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      padding: 20px 22px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .collection-title {
      font-size: 1.02rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    #collection-stats {
      margin-top: 5px;
      font-size: 0.73rem;
      opacity: 0.48;
    }

    .collection-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .collection-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
      gap: 9px;

      padding: 16px 18px 20px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .collection-empty {
      grid-column: 1 / -1;
      padding: 54px 20px;
      text-align: center;
      font-size: 0.84rem;
      opacity: 0.42;
    }

    .collection-item {
      min-width: 0;
      padding: 11px 8px 10px;
      border: 1px solid rgba(255, 255, 255, 0.075);
      border-radius: 15px;

      background: rgba(255, 255, 255, 0.025);
      text-align: center;
    }

    .collection-item.shiny {
      border-color: rgba(255, 238, 164, 0.20);
      background: rgba(255, 238, 164, 0.035);
    }

    .collection-item img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .collection-item-name {
      margin-top: 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      font-size: 0.72rem;
      font-weight: 650;
    }

    .collection-item-rarity {
      margin-top: 3px;
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.035em;
      opacity: 0.42;
    }

    /* Feedback curto, sem poluir a interface */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 50;

      max-width: min(420px, 86vw);
      padding: 9px 13px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 999px;

      background: rgba(14, 14, 14, 0.82);
      color: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(10px);

      font-size: 0.74rem;
      font-weight: 600;
      text-align: center;

      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 7px);

      transition:
        opacity 170ms ease,
        transform 220ms cubic-bezier(.22, 1, .36, 1);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 700px) {
      main {
        padding: 20px;
      }

      .pokemon-panel {
        width: min(88vw, 360px);
      }

      .pokemon-sprite-wrap,
      .pokemon-panel img {
        width: 88px;
        height: 88px;
      }

      .hero:hover .pokemon-panel {
        max-height: 220px;
        margin-top: 14px;
      }

      .hero.details-open:hover .pokemon-panel {
        max-height: 385px;
      }

      .collection-layer {
        padding: 16px;
      }

      .collection-window {
        width: 94vw;
        max-height: 84vh;
      }

      .collection-grid {
        grid-template-columns: repeat(auto-fill, minmax(102px, 1fr));
        padding: 13px;
      }

    }

    @media (prefers-reduced-motion: reduce) {
      .hero {
        animation: none;
      }

      .pokemon-panel,
      .pokemon-panel img,
      .search-layer,
      .search-box {
        transition: none;
      }

      .hero:hover .pokemon-sprite-wrap.shiny::before,
      .hero:hover .pokemon-sprite-wrap.shiny img,
      .hero:hover .pokemon-sprite-wrap.shiny .shiny-sparkles span {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div class="wallpaper"></div>
  <div class="shade"></div>

  <main>
    <section class="hero" aria-label="Relógio e Pokémon">
      <div class="clock-wrap">
        <h1 id="clock">00:00</h1>
      </div>

      <div class="pokemon-panel" id="pokemon-panel" aria-hidden="true">
        <div class="pokemon-sprite-wrap" id="pokemon-sprite-wrap">
          <div class="shiny-sparkles" aria-hidden="true">
            <span>✦</span>
            <span>✦</span>
            <span>✦</span>
            <span>✦</span>
            <span>✦</span>
            <span>✦</span>
          </div>
          <img id="pokemon-sprite" alt="" />
        </div>

        <div id="message"></div>

        <div class="roll-card" id="roll-card">
          <div class="roll-card-inner">
            <div id="roll-name">Pokémon</div>
            <div id="roll-rarity">Common</div>
            <div id="gacha-stats">10 rolls · 2 claims · 0 coins</div>

            <div class="roll-actions">
              <button class="gacha-button primary" id="claim-button" type="button">
                Claim
              </button>
              <button class="gacha-button" id="roll-button" type="button">
                Roll
              </button>
              <button class="gacha-button" id="buy-roll-button" type="button">
                +1 roll · 100
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="search-layer" id="search-layer" aria-hidden="true">
    <div class="search-box">
      <input
        id="search-input"
        type="text"
        placeholder="Pesquisar..."
        autocomplete="off"
        spellcheck="false"
        aria-label="Pesquisar"
      />
    </div>
  </div>

  <div class="collection-layer" id="collection-layer" aria-hidden="true">
    <section class="collection-window" aria-label="Coleção de Pokémon">
      <header class="collection-header">
        <div>
          <div class="collection-title">Collection</div>
          <div id="collection-stats">0 Pokémon · 0 shiny · 0 coins</div>
        </div>

        <div class="collection-header-actions">
          <button class="gacha-button" id="collection-buy-roll" type="button">
            +1 roll · 100
          </button>
          <button class="gacha-button" id="collection-close" type="button">
            Fechar
          </button>
        </div>
      </header>

      <div class="collection-grid" id="collection-grid"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

      "06:00": "A rota abriu.",
      "12:34": "12:34. Satisfatório.",
      "13:37": "Leet o'clock.",
      "20:20": "Visão perfeita.",
      "22:22": "Faz um desejo.",
      "23:59": "Último minuto do dia."
    };

    /* =========================
       ESTADO
       ========================= */

    let currentPhrase = "";
    let currentPhrasePeriod = "";
    let currentEasterEgg = null;

    let nextPokemonPromise = null;
    let pokemonChanging = false;
    let pendingShinySound = false;
    let audioContext = null;
    let toastTimer = null;

    let speciesCountPromise = null;

    const defaultState = () => ({
      version: 1,
      lastReset: "",
      rollsLeft: DAILY_ROLLS,
      claimsLeft: DAILY_CLAIMS,
      coins: 0,
      totalRolls: 0,
      collection: [],
      currentRoll: null
    });

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();

        const parsed = JSON.parse(raw);

        return {
          ...defaultState(),
          ...parsed,
          collection: Array.isArray(parsed.collection)
            ? parsed.collection
            : []
        };
      } catch {
        return defaultState();
      }
    }

    let state = loadState();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch {}
    }

    function getLocalDateKey() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function resetDailyIfNeeded() {
      const today = getLocalDateKey();

      if (state.lastReset !== today) {
        state.lastReset = today;
        state.rollsLeft = DAILY_ROLLS;
        state.claimsLeft = DAILY_CLAIMS;
        saveState();
      }
    }

    /* =========================
       FRASES E RELÓGIO
       ========================= */

    function getPeriod(hour) {
      if (hour < 5) return "madrugada";
      if (hour < 12) return "manha";
      if (hour < 18) return "tarde";
      if (hour < 23) return "noite";
      return "fimDoDia";
    }

    function pickDifferent(items, previous) {
      if (items.length <= 1) return items[0];

      const alternatives = items.filter(item => item !== previous);
      return alternatives[Math.floor(Math.random() * alternatives.length)];
    }

    function updatePhrase(forceRandom = false) {
      const now = new Date();

      const timeKey = now.toLocaleTimeString("pt-BR", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      });

      const easterEgg = TIME_EASTER_EGGS[timeKey];

      if (easterEgg) {
        currentEasterEgg = timeKey;
        currentPhrase = easterEgg;
        message.textContent = easterEgg;
        return;
      }

      const period = getPeriod(now.getHours());

      if (
        forceRandom ||
        currentEasterEgg !== null ||
        currentPhrasePeriod !== period ||
        !currentPhrase
      ) {
        currentPhrase = pickDifferent(PHRASES[period], currentPhrase);
        currentPhrasePeriod = period;
        currentEasterEgg = null;
      }

      message.textContent = currentPhrase;
    }

    function updateClock() {
      const now = new Date();

      clock.textContent = now.toLocaleTimeString("pt-BR", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      });

      updatePhrase(false);
    }

    /* =========================
       POKÉMON / RARIDADE
       ========================= */

    function formatPokemonName(name) {
      return name
        .split("-")
        .map(part => part.charAt(0).toUpperCase() + part.slice(1))
        .join(" ");
    }

    async function getSpeciesCount() {
      if (!speciesCountPromise) {
        speciesCountPromise = fetch(
          "https://pokeapi.co/api/v2/pokemon-species?limit=1"
        )
          .then(response => {
            if (!response.ok) throw new Error("Species count");
            return response.json();
          })
          .then(data => Number(data.count) || 1025)
          .catch(() => 1025);
      }

      return speciesCountPromise;
    }

    async function getRandomPokemonId() {
      const shouldUseFavorite =
        FAVORITE_POKEMON_IDS.length > 0 &&
        Math.random() < FAVORITE_CHANCE;

      if (shouldUseFavorite) {
        return FAVORITE_POKEMON_IDS[
          Math.floor(Math.random() * FAVORITE_POKEMON_IDS.length)
        ];
      }

      const speciesCount = await getSpeciesCount();
      return Math.floor(Math.random() * speciesCount) + 1;
    }

    function determineRarity(pokemon, species) {
      if (species?.is_mythical) {
        return "Mythical";
      }

      if (species?.is_legendary) {
        return "Legendary";
      }

      const baseStatTotal = (pokemon.stats || []).reduce(
        (sum, stat) => sum + Number(stat.base_stat || 0),
        0
      );

      if (baseStatTotal >= 580) return "Epic";
      if (baseStatTotal >= 500) return "Rare";
      if (baseStatTotal >= 420) return "Uncommon";
      return "Common";
    }

    function raritySymbol(rarity) {
      const symbols = {
        Common: "·",
        Uncommon: "◆",
        Rare: "★",
        Epic: "✦",
        Legendary: "♛",
        Mythical: "✧"
      };

      return symbols[rarity] || "·";
    }

    function preloadImage(url) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(url);
        image.onerror = reject;
        image.src = url;
      });
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function preparePokemon() {
      for (let attempt = 0; attempt < 16; attempt++) {
        const pokemonId = await getRandomPokemonId();
        const isShiny = Math.random() < SHINY_CHANCE;

        try {
          const [pokemonResponse, speciesResponse] = await Promise.all([
            fetch(`https://pokeapi.co/api/v2/pokemon/${pokemonId}`),
            fetch(`https://pokeapi.co/api/v2/pokemon-species/${pokemonId}`)
          ]);

          if (!pokemonResponse.ok || !speciesResponse.ok) {
            continue;
          }

          const [pokemon, species] = await Promise.all([
            pokemonResponse.json(),
            speciesResponse.json()
          ]);

          const showdown = pokemon.sprites?.other?.showdown;
          const blackWhiteAnimated =
            pokemon.sprites?.versions?.["generation-v"]?.["black-white"]
              ?.animated;

          const normalAnimated =
            showdown?.front_default ||
            blackWhiteAnimated?.front_default;

          const shinyAnimated =
            showdown?.front_shiny ||
            blackWhiteAnimated?.front_shiny;

          const animatedSprite =
            isShiny ? shinyAnimated : normalAnimated;

          if (!animatedSprite) continue;

          const staticSprite =
            (
              isShiny
                ? pokemon.sprites?.front_shiny
                : pokemon.sprites?.front_default
            ) || animatedSprite;

          await preloadImage(animatedSprite);

          return {
            uid: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
            id: pokemon.id,
            name: formatPokemonName(pokemon.name),
            sprite: animatedSprite,
            staticSprite,
            isShiny,
            rarity: determineRarity(pokemon, species),
            claimed: false
          };
        } catch {
          // Tenta outro Pokémon.
        }
      }

      throw new Error("Não foi possível preparar um Pokémon.");
    }

    function queueNextPokemon() {
      nextPokemonPromise = preparePokemon();
    }

    async function getPreparedPokemon(firstLoad = false) {
      if (firstLoad || !nextPokemonPromise) {
        return preparePokemon();
      }

      const prepared = await nextPokemonPromise;
      nextPokemonPromise = null;
      return prepared;
    }

    /* =========================
       SHINY
       ========================= */

    function getAudioContext() {
      if (!audioContext) {
        const AudioContextClass =
          window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) return null;
        audioContext = new AudioContextClass();
      }

      return audioContext;
    }

    async function playShinySound() {
      try {
        const context = getAudioContext();
        if (!context) return false;

        if (context.state === "suspended") {
          await context.resume();
        }

        if (context.state !== "running") {
          return false;
        }

        const now = context.currentTime;
        const notes = [
          { frequency: 987.77, delay: 0.00, duration: 0.16 },
          { frequency: 1318.51, delay: 0.08, duration: 0.18 },
          { frequency: 1567.98, delay: 0.17, duration: 0.22 },
          { frequency: 2093.00, delay: 0.28, duration: 0.30 }
        ];

        notes.forEach(({ frequency, delay, duration }, index) => {
          const oscillator = context.createOscillator();
          const gain = context.createGain();

          oscillator.type = index % 2 === 0 ? "sine" : "triangle";
          oscillator.frequency.setValueAtTime(
            frequency,
            now + delay
          );

          gain.gain.setValueAtTime(0.0001, now + delay);
          gain.gain.exponentialRampToValueAtTime(
            0.07,
            now + delay + 0.018
          );
          gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + delay + duration
          );

          oscillator.connect(gain);
          gain.connect(context.destination);

          oscillator.start(now + delay);
          oscillator.stop(now + delay + duration + 0.02);
        });

        pendingShinySound = false;
        return true;
      } catch {
        return false;
      }
    }

    async function triggerShinySound() {
      const played = await playShinySound();

      if (!played) {
        pendingShinySound = true;
      }
    }

    function flushPendingShinySound() {
      if (!pendingShinySound) return;
      playShinySound();
    }

    /* =========================
       UI DO GACHA
       ========================= */

    function collectionKey(roll) {
      return `${roll.id}:${roll.isShiny ? "shiny" : "normal"}`;
    }

    function isOwned(roll) {
      const key = collectionKey(roll);
      return state.collection.some(item => item.key === key);
    }

    function updateGachaUI() {
      resetDailyIfNeeded();

      const roll = state.currentRoll;

      gachaStats.textContent =
        `${state.rollsLeft} rolls · ` +
        `${state.claimsLeft} claims · ` +
        `${state.coins} coins`;

      rollButton.disabled =
        state.rollsLeft <= 0 || pokemonChanging;

      buyRollButton.disabled =
        state.coins < EXTRA_ROLL_PRICE;

      collectionBuyRoll.disabled =
        state.coins < EXTRA_ROLL_PRICE;

      if (!roll) {
        rollName.textContent = "Sem roll";
        rollRarity.textContent = "Abra uma nova aba amanhã";
        claimButton.disabled = true;
        claimButton.textContent = "Claim";
        return;
      }

      rollName.textContent = roll.name;

      const shinyPrefix = roll.isShiny ? "✦ SHINY · " : "";
      rollRarity.textContent =
        `${shinyPrefix}${raritySymbol(roll.rarity)} ${roll.rarity}`;

      rollRarity.classList.toggle("shiny", roll.isShiny);

      if (roll.claimed) {
        claimButton.disabled = true;
        claimButton.textContent = "Claimed";
      } else if (state.claimsLeft <= 0) {
        claimButton.disabled = true;
        claimButton.textContent = "Sem claims";
      } else {
        claimButton.disabled = false;
        claimButton.textContent = "Claim";
      }
    }

    function displayRoll(roll, animate = true) {
      if (!roll) return;

      pokemonSpriteWrap.classList.remove("shiny");

      pokemonSprite.src = roll.sprite;
      pokemonSprite.alt = roll.name;
      pokemonSprite.removeAttribute("title");

      if (roll.isShiny) {
        void pokemonSpriteWrap.offsetWidth;
        pokemonSpriteWrap.classList.add("shiny");
        triggerShinySound();
      }

      if (animate) {
        pokemonSprite.classList.add("switching");
        void pokemonSprite.offsetWidth;

        requestAnimationFrame(() => {
          pokemonSprite.classList.remove("switching");
        });
      }

      updateGachaUI();
    }

    async function performRoll({
      consume = true,
      firstLoad = false,
      forcePrepared = false
    } = {}) {
      if (pokemonChanging) return false;

      resetDailyIfNeeded();

      if (consume && state.rollsLeft <= 0) {
        showToast("Sem rolls por hoje.");
        updateGachaUI();
        return false;
      }

      pokemonChanging = true;

      let consumedRoll = false;

      try {
        if (consume) {
          state.rollsLeft -= 1;
          state.totalRolls += 1;
          consumedRoll = true;
          saveState();
        }

        if (!firstLoad && pokemonSprite.getAttribute("src")) {
          pokemonSprite.classList.add("switching");
          await wait(170);
        } else {
          pokemonSprite.classList.add("loading");
        }

        const prepared = await getPreparedPokemon(
          firstLoad && !forcePrepared
        );

        prepared.rollNumber = state.totalRolls;

        state.currentRoll = prepared;
        saveState();

        pokemonSpriteWrap.classList.remove("shiny");
        pokemonSprite.src = prepared.sprite;
        pokemonSprite.alt = prepared.name;
        pokemonSprite.removeAttribute("title");

        if (prepared.isShiny) {
          void pokemonSpriteWrap.offsetWidth;
          pokemonSpriteWrap.classList.add("shiny");
          triggerShinySound();
        }

        if (!firstLoad) {
          void pokemonSprite.offsetWidth;
          requestAnimationFrame(() => {
            pokemonSprite.classList.remove("switching");
          });
        }

        queueNextPokemon();
        updateGachaUI();
        renderCollection();

        return true;
      } catch {
        pokemonSprite.classList.remove("switching");

        if (consumedRoll) {
          state.rollsLeft += 1;
          state.totalRolls = Math.max(0, state.totalRolls - 1);
          saveState();
        }

        showToast("Não consegui carregar o roll. Tenta de novo.");

        if (!nextPokemonPromise) {
          queueNextPokemon();
        }

        updateGachaUI();
        return false;
      } finally {
        pokemonSprite.classList.remove("loading");
        pokemonChanging = false;
      }
    }

    function duplicateReward(roll) {
      const base = DUPLICATE_REWARDS[roll.rarity] || 20;
      return roll.isShiny ? base * 3 : base;
    }

    function claimCurrentPokemon() {
      resetDailyIfNeeded();

      const roll = state.currentRoll;

      if (!roll || roll.claimed) {
        return;
      }

      if (state.claimsLeft <= 0) {
        showToast("Você não tem mais claims hoje.");
        return;
      }

      state.claimsLeft -= 1;
      roll.claimed = true;

      if (isOwned(roll)) {
        const reward = duplicateReward(roll);
        state.coins += reward;

        showToast(
          `Duplicata de ${roll.name}: +${reward} coins.`
        );
      } else {
        state.collection.unshift({
          key: collectionKey(roll),
          id: roll.id,
          name: roll.name,
          sprite: roll.staticSprite || roll.sprite,
          isShiny: roll.isShiny,
          rarity: roll.rarity,
          obtainedAt: new Date().toISOString(),
          rollNumber: roll.rollNumber || state.totalRolls
        });

        showToast(
          roll.isShiny
            ? `✦ ${roll.name} shiny entrou na coleção.`
            : `${roll.name} entrou na coleção.`
        );
      }

      state.currentRoll = roll;
      saveState();

      updateGachaUI();
      renderCollection();
    }

    function buyExtraRoll() {
      resetDailyIfNeeded();

      if (state.coins < EXTRA_ROLL_PRICE) {
        showToast(`Você precisa de ${EXTRA_ROLL_PRICE} coins.`);
        return;
      }

      state.coins -= EXTRA_ROLL_PRICE;
      state.rollsLeft += 1;
      saveState();

      updateGachaUI();
      renderCollection();
      showToast("+1 roll comprado.");
    }

    function toggleRollDetails(force) {
      const open =
        typeof force === "boolean"
          ? force
          : !hero.classList.contains("details-open");

      hero.classList.toggle("details-open", open);
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2400);
    }

    /* =========================
       COLLECTION
       ========================= */

    function openCollection() {
      renderCollection();

      collectionLayer.classList.add("open");
      collectionLayer.setAttribute("aria-hidden", "false");
    }

    function closeCollection() {
      collectionLayer.classList.remove("open");
      collectionLayer.setAttribute("aria-hidden", "true");
    }

    function renderCollection() {
      resetDailyIfNeeded();

      const uniqueSpecies = new Set(
        state.collection.map(item => item.id)
      ).size;

      const shinyCount = state.collection.filter(
        item => item.isShiny
      ).length;

      collectionStats.textContent =
        `${uniqueSpecies} Pokémon · ` +
        `${shinyCount} shiny · ` +
        `${state.coins} coins · ` +
        `${state.rollsLeft} rolls · ` +
        `${state.claimsLeft} claims`;

      collectionBuyRoll.disabled =
        state.coins < EXTRA_ROLL_PRICE;

      collectionGrid.replaceChildren();

      if (!state.collection.length) {
        const empty = document.createElement("div");
        empty.className = "collection-empty";
        empty.textContent =
          "Sua coleção ainda está vazia. Faça um roll e use Claim.";
        collectionGrid.appendChild(empty);
        return;
      }

      const fragment = document.createDocumentFragment();

      state.collection.forEach(item => {
        const card = document.createElement("article");
        card.className =
          `collection-item${item.isShiny ? " shiny" : ""}`;

        const image = document.createElement("img");
        image.src = item.sprite;
        image.alt = item.name;

        const name = document.createElement("div");
        name.className = "collection-item-name";
        name.textContent =
          item.isShiny ? `✦ ${item.name}` : item.name;

        const rarity = document.createElement("div");
        rarity.className = "collection-item-rarity";
        rarity.textContent =
          `${raritySymbol(item.rarity)} ${item.rarity}`;

        card.append(image, name, rarity);
        fragment.appendChild(card);
      });

      collectionGrid.appendChild(fragment);
    }

    /* =========================
       SEARCH
       ========================= */

    function openSearch(initialValue = "") {
      searchLayer.classList.add("open");
      searchLayer.setAttribute("aria-hidden", "false");

      searchInput.value = initialValue;

      const focusSearch = () => {
        searchInput.focus({ preventScroll: true });
        const cursorPosition = searchInput.value.length;
        searchInput.setSelectionRange(cursorPosition, cursorPosition);
      };

      focusSearch();
      requestAnimationFrame(focusSearch);
    }

    function closeSearch() {
      searchLayer.classList.remove("open");
      searchLayer.setAttribute("aria-hidden", "true");
      searchInput.value = "";
      searchInput.blur();
    }

    function runSearch() {
      const query = searchInput.value.trim();

      if (!query) {
        closeSearch();
        return;
      }

      const looksLikeUrl =
        /^https?:\/\//i.test(query) ||
        /^[^\s]+\.[^\s]+$/.test(query);

      if (looksLikeUrl) {
        const target = /^https?:\/\//i.test(query)
          ? query
          : `https://${query}`;

        window.location.href = target;
        return;
      }

      window.location.href =
        `https://www.google.com/search?q=${encodeURIComponent(query)}`;
    }

    /* =========================
       EVENTOS
       ========================= */

    searchInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        runSearch();
      }

      if (event.key === "Escape") {
        event.preventDefault();
        closeSearch();
      }
    });

    searchLayer.addEventListener("mousedown", event => {
      if (event.target === searchLayer) {
        closeSearch();
      }
    });

    collectionClose.addEventListener("click", closeCollection);
    collectionBuyRoll.addEventListener("click", buyExtraRoll);

    collectionLayer.addEventListener("mousedown", event => {
      if (event.target === collectionLayer) {
        closeCollection();
      }
    });

    claimButton.addEventListener("click", event => {
      event.stopPropagation();
      claimCurrentPokemon();
    });

    rollButton.addEventListener("click", event => {
      event.stopPropagation();
      updatePhrase(true);
      performRoll({ consume: true });
    });

    buyRollButton.addEventListener("click", event => {
      event.stopPropagation();
      buyExtraRoll();
    });

    pokemonSprite.addEventListener("click", event => {
      event.stopPropagation();
      flushPendingShinySound();
      toggleRollDetails();
    });

    pokemonPanel.addEventListener("mouseenter", () => {
      if (pokemonSpriteWrap.classList.contains("shiny")) {
        triggerShinySound();
      }
    });

    document.addEventListener("keydown", event => {
      flushPendingShinySound();

      if (event.key === "Escape") {
        if (collectionLayer.classList.contains("open")) {
          event.preventDefault();
          closeCollection();
          return;
        }

        if (searchLayer.classList.contains("open")) {
          return;
        }

        if (hero.classList.contains("details-open")) {
          event.preventDefault();
          toggleRollDetails(false);
          return;
        }
      }

      if (
        event.ctrlKey ||
        event.altKey ||
        event.metaKey ||
        event.isComposing
      ) {
        return;
      }

      if (
        collectionLayer.classList.contains("open") ||
        document.activeElement === searchInput
      ) {
        return;
      }

      // Shift + C = coleção.
      if (
        event.shiftKey &&
        event.key.toLowerCase() === "c"
      ) {
        event.preventDefault();
        openCollection();
        return;
      }

      // Shift + R = novo roll, consumindo um roll diário.
      if (
        event.shiftKey &&
        event.key.toLowerCase() === "r"
      ) {
        event.preventDefault();
        updatePhrase(true);
        performRoll({ consume: true });
        return;
      }

      // Atalhos externos continuam exigindo Shift.
      if (event.shiftKey) {
        const shortcut = KEYBOARD_SHORTCUTS[event.key.toLowerCase()];

        if (shortcut) {
          event.preventDefault();
          window.location.href = shortcut;
          return;
        }
      }

      // Space ou / abre a pesquisa vazia.
      if (event.key === "/" || event.key === " ") {
        event.preventDefault();
        openSearch();
        return;
      }

      // Qualquer caractere digitável inicia a busca.
      if (event.key.length === 1) {
        event.preventDefault();
        openSearch(event.key);
      }
    });

    document.addEventListener(
      "pointerdown",
      flushPendingShinySound,
      { passive: true }
    );

    /* =========================
       ADAPTIVE TAB BAR COLOUR
       ========================= */

    function getWallpaperUrl() {
      const value = getComputedStyle(document.documentElement)
        .getPropertyValue("--wallpaper")
        .trim();

      const match = value.match(/^url\(["']?(.*?)["']?\)$/);
      return match?.[1] || null;
    }

    function syncThemeColorToWallpaper() {
      const wallpaperUrl = getWallpaperUrl();
      if (!wallpaperUrl) return;

      const image = new Image();

      image.onload = () => {
        try {
          const sampleWidth = 96;
          const sampleHeight = 8;

          const canvas = document.createElement("canvas");
          canvas.width = sampleWidth;
          canvas.height = sampleHeight;

          const context = canvas.getContext("2d", {
            willReadFrequently: true
          });

          if (!context) return;

          const viewportRatio = innerWidth / innerHeight;
          const imageRatio = image.naturalWidth / image.naturalHeight;

          let visibleWidth;
          let visibleHeight;
          let sourceX;
          let sourceY;

          if (imageRatio > viewportRatio) {
            visibleHeight = image.naturalHeight;
            visibleWidth = visibleHeight * viewportRatio;
            sourceX = (image.naturalWidth - visibleWidth) / 2;
            sourceY = 0;
          } else {
            visibleWidth = image.naturalWidth;
            visibleHeight = visibleWidth / viewportRatio;
            sourceX = 0;
            sourceY = (image.naturalHeight - visibleHeight) / 2;
          }

          const topStripHeight = Math.max(
            1,
            visibleHeight * (sampleHeight / innerHeight)
          );

          context.drawImage(
            image,
            sourceX,
            sourceY,
            visibleWidth,
            topStripHeight,
            0,
            0,
            sampleWidth,
            sampleHeight
          );

          const pixels = context.getImageData(
            0,
            0,
            sampleWidth,
            sampleHeight
          ).data;

          let red = 0;
          let green = 0;
          let blue = 0;
          let count = 0;

          for (let i = 0; i < pixels.length; i += 4) {
            if (pixels[i + 3] === 0) continue;

            red += pixels[i];
            green += pixels[i + 1];
            blue += pixels[i + 2];
            count++;
          }

          if (!count) return;

          red /= count;
          green /= count;
          blue /= count;

          const overlay = parseFloat(
            getComputedStyle(document.documentElement)
              .getPropertyValue("--overlay")
          ) || 0;

          const topShade = 0.24;
          const keep = (1 - overlay) * (1 - topShade);

          red = Math.round(red * keep);
          green = Math.round(green * keep);
          blue = Math.round(blue * keep);

          const hex = `#${[red, green, blue]
            .map(value => value.toString(16).padStart(2, "0"))
            .join("")}`;

          themeColor.setAttribute("content", hex);
        } catch {
          themeColor.setAttribute("content", "#101010");
        }
      };

      image.onerror = () => {
        themeColor.setAttribute("content", "#101010");
      };

      image.src = wallpaperUrl;
    }

    /* =========================
       BOOT
       ========================= */

    async function bootGacha() {
      resetDailyIfNeeded();
      updateGachaUI();
      renderCollection();

      /*
        Abrir uma nova aba = 1 roll gratuito do estoque diário.
        Quando os rolls acabam, mostramos o último roll salvo.
      */
      if (state.rollsLeft > 0) {
        await performRoll({
          consume: true,
          firstLoad: true
        });
      } else if (state.currentRoll) {
        displayRoll(state.currentRoll, false);
        queueNextPokemon();
      } else {
        showToast("Seus rolls voltam amanhã.");
      }
    }

    updateClock();
    updatePhrase(true);
    syncThemeColorToWallpaper();
    bootGacha();

    /*
      Atualiza no início de cada novo minuto.
      Também ativa os easter eggs exatamente no horário certo.
    */
    const delay = (60 - new Date().getSeconds()) * 1000;

    setTimeout(() => {
      updateClock();
      setInterval(updateClock, 60_000);
    }, delay);

    window.addEventListener("resize", syncThemeColorToWallpaper);
  </script>
</body>
</html>
